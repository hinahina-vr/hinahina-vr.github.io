    function updateSlotLandmarks(sl, dt = 1 / 60) {
      const hum = sl.avatar.vrm?.humanoid;
      if (!hum) return;
      const rb = n => hum.getRawBoneNode(n);
      const nHips = rb('hips');
      const nChest = rb('upperChest') || rb('chest') || rb('spine');
      const nHead = rb('head');
      const nEyeL = rb('leftEye');
      const nEyeR = rb('rightEye');
      const nFootL = rb('leftFoot');
      const nFootR = rb('rightFoot');
      if (!nHips || !nHead) return;

      nHips.getWorldPosition(_bHips);
      if (nChest) nChest.getWorldPosition(_bChest); else _bChest.copy(_bHips).y += 0.20;
      nHead.getWorldPosition(_bHead);

      const zS = modelFrontZSign;
      let eyeX = _bHead.x, eyeY = _bHead.y + 0.038, eyeZ = _bHead.z + 0.072 * zS;
      if (nEyeL && nEyeR) {
        nEyeL.getWorldPosition(_bEyeL);
        nEyeR.getWorldPosition(_bEyeR);
        eyeX = (_bEyeL.x + _bEyeR.x) * 0.5;
        eyeY = (_bEyeL.y + _bEyeR.y) * 0.5;
        eyeZ = (_bEyeL.z + _bEyeR.z) * 0.5;
      }

      let footY = 0.13;
      if (nFootL && nFootR) {
        nFootL.getWorldPosition(_bFootL);
        nFootR.getWorldPosition(_bFootR);
        // Smooth soft-min instead of sharp Math.min kink when feet alternate during dance!
        const avgY = (_bFootL.y + _bFootR.y) * 0.5;
        const minY = Math.min(_bFootL.y, _bFootR.y);
        footY = (avgY * 0.4 + minY * 0.6) + 0.05;
      }

      const lm = sl.landmarks;
      const k = lm.ready ? (1.0 - Math.exp(-dt * 10.0)) : 1.0;
      lm.spineX += (_bHips.x * 0.42 - lm.spineX) * k;
      lm.spineZ += (_bHips.z - lm.spineZ) * k;
      lm.footY  += (footY - lm.footY) * k;
      lm.hipsY  += (_bHips.y - lm.hipsY) * k;
      lm.broochX += (_bChest.x * 0.50 - lm.broochX) * k;
      lm.broochY += (_bChest.y - lm.broochY) * k;
      lm.broochZ += ((_bChest.z + 0.056 * zS) - lm.broochZ) * k;

      // Smoothly blend front-facing eye depth so 360° spins never trigger a sudden Z switch!
      const fallbackEyeZ = _bHead.z + 0.072 * zS;
      const facing = THREE.MathUtils.clamp(((eyeZ - _bHead.z) * zS) / 0.05, 0, 1);
      const frontEyeZ = THREE.MathUtils.lerp(fallbackEyeZ, eyeZ, smootherstep01(facing));
      lm.eyeX += (eyeX * 0.52 - lm.eyeX) * k;
      lm.eyeY += ((eyeY - 0.008) - lm.eyeY) * k;
      lm.eyeZ += (frontEyeZ - lm.eyeZ) * k;
      lm.ready = true;
    }

    // C-infinity smooth Quadratic Bezier body curve (0.0=boots -> 1.0=sparkling eyes, ZERO corner kinks!)
    function evalSpinePoint(lm, hNorm, zS, out) {
      const u = THREE.MathUtils.clamp(hNorm, 0, 1);
      const inv = 1 - u;
      const w0 = inv * inv;
      const w1 = 2 * inv * u;
      const w2 = u * u;
      const p0x = lm.spineX, p0y = lm.footY, p0z = lm.spineZ + 0.015 * zS;
      const p1x = (lm.spineX + lm.broochX) * 0.5;
      const p1y = lm.hipsY * 0.35 + lm.broochY * 0.65;
      const p1z = lm.spineZ * 0.30 + lm.broochZ * 0.70;
      const p2x = lm.eyeX, p2y = lm.eyeY, p2z = lm.eyeZ;
      out.set(
        w0 * p0x + w1 * p1x + w2 * p2x,
        w0 * p0y + w1 * p1y + w2 * p2y,
        w0 * p0z + w1 * p1z + w2 * p2z
      );
      return out;
    }

    function evalTwinHeartbeat(t, period = 0.86) {
      const b = (t % period) / period;
      const lub = Math.exp(-Math.pow((b - 0.14) / 0.085, 2));
      const dub = 0.65 * Math.exp(-Math.pow((b - 0.34) / 0.095, 2));
      return lub + dub;
    }

    function updateSlotCameraMotion(sl, dt = 1 / 60) {
      updateSlotLandmarks(sl, dt);

      if (sl.userDragging || sl.camAnim === 'none') {
        sl.camera.fov = 28;
        sl.camera.up.set(0, 1, 0);
        sl.camRig.ready = false;
        sl.controls.update();
        return;
      }

      const t = sl.time;
      const zS = modelFrontZSign;
      const aspectMul = currentLayout === 'cols4' ? 1.62 : (currentLayout === 'vertical9x16' ? 1.28 : 1.0);
      const pathScale = aspectMul * (sl.zoomScale || 1.0);
      const lm = sl.landmarks;

      sl.camera.up.set(0, 1, 0);
      let desiredRoll = 0;
      let desiredFov = 28;

      const choreo = CAM_CHOREO_TABLES[sl.camAnim];
      if (choreo) {
        const p = ((t % choreo.dur) + choreo.dur) % choreo.dur / choreo.dur;
        const kfs = choreo.kfs;
        let hNorm = 0.5, dist = 0.6, yawDeg = 0, rollDeg = 0, fov = 32, yLift = 0, pulseAmt = 0;
        for (let i = 0; i < kfs.length - 1; i++) {
          if (p <= kfs[i + 1][0] || i === kfs.length - 2) {
            const k0 = kfs[i], k1 = kfs[i + 1];
            const span = Math.max(1e-6, k1[0] - k0[0]);
            const easeFn = CAM_EASE_FNS[k1[8]] || smootherstep01;
            const u = easeFn(THREE.MathUtils.clamp((p - k0[0]) / span, 0, 1));
            hNorm    = THREE.MathUtils.lerp(k0[1], k1[1], u);
            dist     = THREE.MathUtils.lerp(k0[2], k1[2], u);
            yawDeg   = THREE.MathUtils.lerp(k0[3], k1[3], u);
            rollDeg  = THREE.MathUtils.lerp(k0[4], k1[4], u);
            fov      = THREE.MathUtils.lerp(k0[5], k1[5], u);
            yLift    = THREE.MathUtils.lerp(k0[6], k1[6], u);
            pulseAmt = THREE.MathUtils.lerp(k0[7], k1[7], u);
            break;
          }
        }
        const hb = evalTwinHeartbeat(t, sl.camAnim === 'magic_heart_dolly' ? 0.78 : 0.88) * pulseAmt;
        dist = Math.max(0.28, dist - 0.022 * hb);
        desiredFov = fov + 2.0 * hb;
        desiredRoll = (rollDeg + Math.sin(t * 1.35) * 1.2 * pulseAmt) * DEG;

        const yaw = yawDeg * DEG;
        const r = dist * pathScale;
        evalSpinePoint(lm, hNorm, zS, _spinePt);
        _rawPos.set(
          _spinePt.x + Math.sin(yaw) * r,
          _spinePt.y + yLift,
          _spinePt.z + Math.cos(yaw) * r * zS
        );

        // Frame-rate-independent Steadicam smoothing in 3D Cartesian space (100% zero snap / zero loop jump!)
        const rig = sl.camRig;
        if (!rig.ready) {
          rig.pos.copy(_rawPos);
          rig.tgt.copy(_spinePt);
          rig.roll = desiredRoll;
          rig.fov = desiredFov;
          rig.ready = true;
        } else {
          const a = 1.0 - Math.exp(-Math.min(0.05, dt) * 12.5);
          rig.pos.lerp(_rawPos, a);
          rig.tgt.lerp(_spinePt, a);
          rig.roll += (desiredRoll - rig.roll) * a;
          rig.fov  += (desiredFov - rig.fov) * a;
        }
        sl.controls.target.copy(rig.tgt);
        sl.camera.position.copy(rig.pos);
        sl.camera.fov = rig.fov;
        sl.camera.lookAt(sl.controls.target);
        if (Math.abs(rig.roll) > 1e-4) sl.camera.rotateZ(rig.roll);
        return;
      }

      if (sl.camAnim === 'gachikoi_breath') {
        _camOffsetTmp.subVectors(sl.baseCamPos, sl.baseCamTgt);
        const baseYaw = Math.atan2(_camOffsetTmp.x, _camOffsetTmp.z);
        const rH = Math.hypot(_camOffsetTmp.x, _camOffsetTmp.z);
        const pulse = evalTwinHeartbeat(t, 1.05);
        const dolly = 1.0 - 0.14 * (0.5 - 0.5 * Math.cos(t * 0.90)) - 0.018 * pulse;
        const yaw = baseYaw + Math.sin(t * 0.68) * 0.15;
        desiredRoll = Math.sin(t * 0.85) * 1.4 * DEG;
        sl.camera.position.set(
          sl.baseCamTgt.x + Math.sin(yaw) * rH * dolly,
          sl.baseCamPos.y + Math.sin(t * 1.1) * 0.014,
          sl.baseCamTgt.z + Math.cos(yaw) * rH * dolly
        );
        sl.controls.target.copy(sl.baseCamTgt);
      } else if (sl.camAnim === 'orbit_soft') {
        _camOffsetTmp.subVectors(sl.baseCamPos, sl.baseCamTgt);
        const baseYaw = Math.atan2(_camOffsetTmp.x, _camOffsetTmp.z);
        const rH = Math.hypot(_camOffsetTmp.x, _camOffsetTmp.z);
        const yaw = baseYaw + Math.sin(t * 0.55) * 0.36;
        sl.camera.position.set(
          sl.baseCamTgt.x + Math.sin(yaw) * rH,
          sl.baseCamPos.y + Math.sin(t * 0.8) * 0.025,
          sl.baseCamTgt.z + Math.cos(yaw) * rH
        );
        sl.controls.target.copy(sl.baseCamTgt);
      } else if (sl.camAnim === 'orbit_360') {
        _camOffsetTmp.subVectors(sl.baseCamPos, sl.baseCamTgt);
        const baseYaw = Math.atan2(_camOffsetTmp.x, _camOffsetTmp.z);
        const rH = Math.hypot(_camOffsetTmp.x, _camOffsetTmp.z);
        const yaw = baseYaw + t * 0.65;
        sl.camera.position.set(
          sl.baseCamTgt.x + Math.sin(yaw) * rH,
          sl.baseCamPos.y,
          sl.baseCamTgt.z + Math.cos(yaw) * rH
        );
        sl.controls.target.copy(sl.baseCamTgt);
      } else if (sl.camAnim === 'dolly_in') {
        _camOffsetTmp.subVectors(sl.baseCamPos, sl.baseCamTgt);
        const s = 1.0 - 0.24 * (0.5 - 0.5 * Math.cos(t * 0.68));
        sl.camera.position.copy(sl.baseCamTgt).addScaledVector(_camOffsetTmp, s);
        sl.controls.target.copy(sl.baseCamTgt);
      } else if (sl.camAnim === 'pan_up') {
        const cyc = (t % 8.0) / 8.0;
        const u = cyc < 0.80 ? (cyc / 0.80) : (1.0 - (cyc - 0.80) / 0.20);
        const smoothU = smootherstep01(u);
        evalSpinePoint(lm, smoothU, zS, _spinePt);
        const dist = THREE.MathUtils.lerp(1.35, 0.72, smoothU) * pathScale;
        const yaw = Math.sin(t * 0.5) * 8 * DEG;
        sl.controls.target.copy(_spinePt);
        sl.camera.position.set(_spinePt.x + Math.sin(yaw) * dist, _spinePt.y + 0.03, _spinePt.z + Math.cos(yaw) * dist * zS);
      }

      sl.camera.fov = desiredFov;
      sl.camera.lookAt(sl.controls.target);
      if (Math.abs(desiredRoll) > 1e-4) {
        sl.camera.rotateZ(desiredRoll);
      }
    }

    function clearStudioSlot(sl) {
      sl.motionRequest += 1;
      sl.springRem = 0;
      for (const [mesh, material] of sl.mtoonMap) {
        mesh.material = material;
        for (const item of [].concat(material)) {
          if (item?.matcapTexture === ANIME_LUSTER_MATCAP) item.matcapTexture = null;
        }
      }
      for (const material of sl.unlitMap.values()) {
        for (const generated of [].concat(material)) generated?.dispose();
      }
      sl.mtoonMap.clear();
      sl.unlitMap.clear();
      sl.avatar.release();
    }

    async function installModelSlots(bytes, targetSlots) {
      const results = await Promise.allSettled(targetSlots.map(() => parseAvatar(bytes)));
      const failure = results.find(result => result.status === 'rejected');
      if (failure) {
        for (const result of results) {
          if (result.status === 'fulfilled') disposeAvatar(result.value);
        }
        throw failure.reason;
      }

      for (const [i, sl] of targetSlots.entries()) {
        clearStudioSlot(sl);
        sl.avatar.use(results[i].value);
      }
      const humanoid = slots[0].avatar.vrm.humanoid;
      const head = humanoid.getRawBoneNode('head').getWorldPosition(new THREE.Vector3());
      const eye = humanoid.getRawBoneNode('leftEye')?.getWorldPosition(new THREE.Vector3());
      modelFrontZSign = eye?.z < head.z ? -1 : 1;
      modelCameraScale = THREE.MathUtils.clamp(head.y / 0.98, 0.35, 4);

      for (const sl of targetSlots) {
        sl.landmarks.ready = false;
        sl.emoState.ready = false;
        sl.camRig.ready = false;
        upgradeExpressionOverrides(sl.avatar.vrm);
        calibrateNormalizedRig(sl);
        buildUnlitMaterials(sl);
      }
      applyShaderMode();
      applyStageTheme();
    }

    function ensureDesktopSlotsHydrated() {
      if (desktopSlotsHydrated || !cachedVrmBuffer) return desktopHydration;
      desktopHydration ??= installModelSlots(cachedVrmBuffer, slots.slice(1)).then(() => {
        desktopSlotsHydrated = true;
      }).finally(() => {
        desktopHydration = null;
      });
      return desktopHydration;
    }

    function showModelError(error) {
      console.warn('VRM load failed:', error);
      const msg = '読込エラー · ' + error.message;
      const status = document.getElementById('modelBadge');
      status.textContent = msg;
      status.hidden = false;
      if (isMobileViewport()) alert(msg);
    }

    async function loadStudioModel(readBytes, name) {
      if (changingModel) return;
      changingModel = true;
      const mask = document.getElementById('loadingMask');
      const buttons = [document.getElementById('btnLoadVrm'), document.getElementById('btnMobileLoadVrm')];
      buttons.forEach(button => { button.disabled = true; });
      mask.classList.remove('hidden');
      document.getElementById('loadingText').textContent = 'VRMを読み込み中…';
      try {
        if (desktopHydration) await desktopHydration;
        const bytes = await readBytes();
        const targetSlots = isMobileViewport() ? slots.slice(0, 1) : slots;
        await installModelSlots(bytes, targetSlots);
        desktopSlotsHydrated = targetSlots.length === slots.length;
        if (!desktopSlotsHydrated) slots.slice(1).forEach(clearStudioSlot);
        cachedVrmBuffer = bytes;

        const active = SHOWCASE_PRESETS.find(preset => preset.id === activePresetId);
        const preset = isMobileViewport() && active?.layout !== 'vertical9x16'
          ? 'p13_short_gachikoi'
          : activePresetId;
        if (!isMobileViewport()) await ensureDesktopSlotsHydrated();
        await applyPresetById(preset);
        const status = document.getElementById('modelBadge');
        status.textContent = name;
        status.hidden = true;
      } catch (error) {
        showModelError(error);
      } finally {
        mask.classList.add('hidden');
        buttons.forEach(button => { button.disabled = false; });
        changingModel = false;
      }
    }

      document.querySelectorAll('#studioTabs .studio-tab').forEach(b => {

    function createPresetButtonEl(p) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn preset-btn' + (p.id === activePresetId ? ' active' : '');
      btn.dataset.pid = p.id;
      btn.title = p.desc;
      const miniTag = p.layout === 'cols4'
        ? '<span class="p-mini-tag">4列</span>'
        : (p.layout === 'single16x9' ? '<span class="p-mini-tag">1枚</span>' : '');
      btn.innerHTML = `<span class="p-num">${p.num}</span><span class="p-title">${p.label}</span>${miniTag}`;
      btn.addEventListener('click', () => {
        if (!changingModel && mediaRecorder?.state !== 'recording') void applyPresetById(p.id).catch(showModelError);
      });
      return btn;
    }

    function setToggleDisabled(inputId, disabled, reason = '') {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      inp.disabled = !!disabled;
      const row = inp.closest('.toggle-row');
      if (row) {
        row.classList.toggle('is-disabled', !!disabled);
        row.title = disabled ? reason : '';
      }
    }

      const inp = document.getElementById(inputId);
      if (!inp) return;

      const row = inp.closest('.slider-row');
      if (row) {

        row.title = disabled ? reason : '';

      });

      const camPresetsDisabled = FULL_PATH_CAM_ANIMS.has(sl?.camAnim);
      document.querySelectorAll('#slotCamPresets .btn').forEach(b => {
        b.disabled = camPresetsDisabled;
        b.title = camPresetsDisabled ? '変身・チルトアップ自動カメラ中は距離が自動制御されるため無効（ホイール拡大縮小は可能）' : '';
      });

      // 7) Tab 2: Mouth Shape dropdown when Lip-sync Talk (autoTalk) is ON
      const selMouth = document.getElementById('selSlotMouth');
      const mouthDisabled = !!sl?.autoTalk;
      if (selMouth) {
        selMouth.disabled = mouthDisabled;
        selMouth.title = mouthDisabled ? '口パクON中は口が自動で動くため無効' : '';
      }

      // 8) Tab 2: Auto-Blink & Eye LookAt toggles when fixed closed/half-closed eye expressions are active
      const blinkLocked = ['happy', 'jitome', 'blinkRight', 'blinkLeft'].includes(sl?.exprMode);
      setToggleDisabled('chkSlotBlink', blinkLocked, '閉じ目・ジト目・ウインク固定中はまばたきしないため無効');

      const vrmLoaded = !!sl?.avatar?.vrm;
      const noLookAtSupport = vrmLoaded && !sl.avatar.vrm.lookAt;
      const eyesClosed = (sl?.exprMode === 'happy');
      const lookDisabled = noLookAtSupport || eyesClosed;
      setToggleDisabled(
        'chkSlotLookAt',
        lookDisabled,
        noLookAtSupport ? 'このVRMは目線追従に非対応のため無効' : '閉じ目固定中は目線が見えないため無効'
      );

      // 9) Tab 3: Stage 3D Crystal Chords & Water Mirror Floor under White Studio / Chroma Key
      const particlesDisabled = !!(th.chroma || th.hideParticles);
      const floorDisabled = !!th.chroma;
      setToggleDisabled('chkParticles', particlesDisabled, '白スタジオ・グリーンバック中は光柱を表示しないため無効');
      setToggleDisabled('chkFloorRing', floorDisabled, 'グリーンバック中は水面床を表示しないため無効');

      // 10) Tab 3: MToon button if loaded VRM contains zero MToon materials
      let hasAnyMtoon = !vrmLoaded;
      if (vrmLoaded) {
        for (const matOrArr of sl.mtoonMap.values()) {
          const arr = Array.isArray(matOrArr) ? matOrArr : [matOrArr];
          if (arr.some(m => m && m.isMToonMaterial)) { hasAnyMtoon = true; break; }
        }
      }
      const btnMtoon = document.getElementById('btnShaderMtoon');
      if (btnMtoon) {
        btnMtoon.disabled = !hasAnyMtoon;
        btnMtoon.title = !hasAnyMtoon ? 'このVRMはMToonマテリアルを含まないため無効' : '';
      }

      // 11) Tab 3: Split Border Color buttons (#borderBtns) in 1-panel mode
      document.querySelectorAll('#borderBtns .btn').forEach(b => {
        b.disabled = isSinglePanel;
        b.title = isSinglePanel ? '2×2分割・4列モード時のみ有効' : '';
      });

      // 12) Tab 3: MP4 Color Range dropdown (#selRecRange) when WebM is selected or during recording
      const selRange = document.getElementById('selRecRange');
      if (selRange) {
        const fmtVal = document.getElementById('selRecFmt')?.value || 'mp4';

      }

    // =========================================================================
    // Zero-Blowout Video Recording Engine (Rec.709 Studio-Range 16..235 + colr Fix)
    // =========================================================================
    let recChunks = [];
    let recStartTime = 0;
    let recAutoStopSec = 0;
    let lastBlobUrl = null;
    let mp4EncoderFullRange = false;
    let recUseStudioComp = false;

    const recCanvas = document.createElement('canvas');
    const recGl = recCanvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: true,
      powerPreference: 'high-performance',
    });

    const recBlitter = (() => {
      if (!recGl) return null;
      const compile = (type, src) => {
        const sh = recGl.createShader(type);
        recGl.shaderSource(sh, src);
        recGl.compileShader(sh);
        return sh;
      };
      const vs = compile(recGl.VERTEX_SHADER, `#version 300 es
        out vec2 vUv;
        void main() {
          vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
          vUv = p * 0.5 + 0.5;
          gl_Position = vec4(p, 0.0, 1.0);
        }
      `);
      const fs = compile(recGl.FRAGMENT_SHADER, `#version 300 es
        precision highp float;
        uniform sampler2D uTex;
        uniform int uStudioRange;
        in vec2 vUv;
        out vec4 fragColor;
        void main() {
          vec3 rgb = texture(uTex, vUv).rgb;
          if (uStudioRange == 1) {
            float y = dot(rgb, vec3(0.2126, 0.7152, 0.0722));
            float yTv = (16.0 / 255.0) + (219.0 / 255.0) * y;
            vec3 outRgb = yTv + (224.0 / 255.0) * (rgb - y);
            fragColor = vec4(clamp(outRgb, 0.0, 1.0), 1.0);
          } else {
            fragColor = vec4(rgb, 1.0);
          }
        }
      `);
      const prog = recGl.createProgram();
      recGl.attachShader(prog, vs);
      recGl.attachShader(prog, fs);
      recGl.linkProgram(prog);

      const vao = recGl.createVertexArray();
      const tex = recGl.createTexture();
      recGl.bindTexture(recGl.TEXTURE_2D, tex);
      recGl.texParameteri(recGl.TEXTURE_2D, recGl.TEXTURE_MIN_FILTER, recGl.LINEAR);
      recGl.texParameteri(recGl.TEXTURE_2D, recGl.TEXTURE_MAG_FILTER, recGl.LINEAR);
      recGl.texParameteri(recGl.TEXTURE_2D, recGl.TEXTURE_WRAP_S, recGl.CLAMP_TO_EDGE);
      recGl.texParameteri(recGl.TEXTURE_2D, recGl.TEXTURE_WRAP_T, recGl.CLAMP_TO_EDGE);

      return {
        prog,
        vao,
        tex,
        uTex: recGl.getUniformLocation(prog, 'uTex'),
        uStudioRange: recGl.getUniformLocation(prog, 'uStudioRange'),
      };
    })();

    function blitToRecordingCanvas() {
      const W = canvas.width;
      const H = canvas.height;
      if (recCanvas.width !== W || recCanvas.height !== H) {
        recCanvas.width = W;
        recCanvas.height = H;
      }
      if (!recGl || !recBlitter) return;
      recGl.viewport(0, 0, W, H);
      recGl.useProgram(recBlitter.prog);
      recGl.bindVertexArray(recBlitter.vao);
      recGl.activeTexture(recGl.TEXTURE0);
      recGl.bindTexture(recGl.TEXTURE_2D, recBlitter.tex);
      recGl.pixelStorei(recGl.UNPACK_FLIP_Y_WEBGL, true);
      recGl.texImage2D(recGl.TEXTURE_2D, 0, recGl.RGBA8, recGl.RGBA, recGl.UNSIGNED_BYTE, canvas);
      recGl.uniform1i(recBlitter.uTex, 0);
      recGl.uniform1i(recBlitter.uStudioRange, recUseStudioComp ? 1 : 0);
      recGl.drawArrays(recGl.TRIANGLES, 0, 3);
    }

    function inspectMp4NclxColrBox(u8) {
      // Locate 19-byte ISO-BMFF colr('nclx') box inside moov header:
      // [00 00 00 13] ['c' 'o' 'l' 'r'] ['n' 'c' 'l' 'x'] [prim:u16] [trc:u16] [mat:u16] [full:u8]
      const limit = Math.min(u8.length - 19, 262144);
      for (let i = 0; i <= limit; i++) {
        if (
          u8[i] === 0x00 && u8[i + 1] === 0x00 && u8[i + 2] === 0x00 && u8[i + 3] === 0x13 &&
          u8[i + 4] === 0x63 && u8[i + 5] === 0x6f && u8[i + 6] === 0x6c && u8[i + 7] === 0x72 &&
          u8[i + 8] === 0x6e && u8[i + 9] === 0x63 && u8[i + 10] === 0x6c && u8[i + 11] === 0x78
        ) {
          const dv = new DataView(u8.buffer, u8.byteOffset + i, 19);
          return {
            offset: i,
            primaries: dv.getUint16(12, false),
            transfer: dv.getUint16(14, false),
            matrix: dv.getUint16(16, false),
            fullRange: (dv.getUint8(18) >> 7) & 1,
          };
        }
      }
      return null;
    }

    async function normalizeMp4ColrToTvBt709(rawBlob) {
      const buf = await rawBlob.arrayBuffer();
      const u8 = new Uint8Array(buf);
      const info = inspectMp4NclxColrBox(u8);
      if (info) {
        const dv = new DataView(buf, info.offset, 19);
        // Set ITU-R BT.709 (1 / 1 / 1) + Limited Studio TV Range (full_range_flag = 0)
        // so Windows D3D11/MediaPlayer, FFmpeg, Chrome, QuickTime, Premiere, X, & YouTube decode identically!
        dv.setUint16(12, 1, false);
        dv.setUint16(14, 1, false);
        dv.setUint16(16, 1, false);
        dv.setUint8(18, 0x00);
      }
      return new Blob([buf], {type: 'video/mp4'});
    }

    function pickBestVideoMime(preferFmt = 'mp4') {
      const mp4List = [
        {mime: 'video/mp4;codecs=avc1.640034', ext: 'mp4'},
        {mime: 'video/mp4;codecs=avc1.42E01E', ext: 'mp4'},
        {mime: 'video/mp4', ext: 'mp4'},
      ];
      const webmList = [
        {mime: 'video/webm;codecs=vp9', ext: 'webm'},
        {mime: 'video/webm;codecs=vp8', ext: 'webm'},
        {mime: 'video/webm', ext: 'webm'},
      ];
      const candidates = preferFmt === 'webm' ? [...webmList, ...mp4List] : [...mp4List, ...webmList];
      for (const c of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(c.mime)) return c;
      }
      return {mime: '', ext: 'webm'};
    }

    async function calibrateMp4EncoderRange() {
      const best = pickBestVideoMime('mp4');
      if (best.ext !== 'mp4') {
        mp4EncoderFullRange = false;
        document.body.dataset.mp4EncoderRange = 'unsupported';
        return;
      }
      return new Promise(resolve => {
        try {
          const pc = document.createElement('canvas');
          pc.width = 640;
          pc.height = 360;
          const pgl = pc.getContext('webgl2', {
            alpha: false, antialias: false, depth: false, stencil: false,
            preserveDrawingBuffer: true, powerPreference: 'high-performance',
          });
          if (!pgl) {
            mp4EncoderFullRange = false;
            document.body.dataset.mp4EncoderRange = 'no_webgl2';
            resolve();
            return;
          }
          pgl.clearColor(0.92, 0.92, 0.94, 1.0);
          pgl.clear(pgl.COLOR_BUFFER_BIT);

          const pStream = pc.captureStream(30);
          const pChunks = [];
          const mr = new MediaRecorder(pStream, {mimeType: best.mime, videoBitsPerSecond: 4_000_000});
          let settled = false;
          const finish = async () => {
            if (settled) return;
            settled = true;
            clearInterval(drawTimer);
            pStream.getTracks().forEach(t => t.stop());
            try {
              const b = new Blob(pChunks, {type: 'video/mp4'});
              const u8 = new Uint8Array(await b.arrayBuffer());
              const info = inspectMp4NclxColrBox(u8);
              mp4EncoderFullRange = info ? (info.fullRange === 1) : false;
              document.body.dataset.mp4EncoderRange = info
                ? `${info.fullRange === 1 ? 'full_pc' : 'limited_tv'}_p${info.primaries}_t${info.transfer}_m${info.matrix}`
                : 'no_colr';
            } catch {
              mp4EncoderFullRange = false;
              document.body.dataset.mp4EncoderRange = 'probe_err';
            }
            resolve();
          };
          const drawTimer = setInterval(() => {
            pgl.clearColor(0.92, 0.92, 0.94, 1.0);
            pgl.clear(pgl.COLOR_BUFFER_BIT);
          }, 25);
          mr.ondataavailable = e => { if (e.data && e.data.size > 0) pChunks.push(e.data); };
          mr.onstop = finish;
          mr.start(80);
          setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 200);
          setTimeout(finish, 650);
        } catch {
          mp4EncoderFullRange = false;
          document.body.dataset.mp4EncoderRange = 'exception';
          resolve();
        }
      });
    }

    function startRecording() {
      if (changingModel || !slots[0].avatar.vrm) return;
      setMobileMenuOpen(false);
      document.body.classList.add('is-recording');
      fitStagePreview();
      if (document.getElementById('chkSyncOnRec').checked) syncRestartAllSlots();

      const preferFmt = document.getElementById('selRecFmt').value || 'mp4';
      const {mime, ext} = pickBestVideoMime(preferFmt);
      const rangeMode = document.getElementById('selRecRange').value || 'auto';

      if (ext === 'mp4') {
        if (rangeMode === 'auto') recUseStudioComp = mp4EncoderFullRange;
        else if (rangeMode === 'force_tv') recUseStudioComp = true;
        else recUseStudioComp = false;
      } else {
        recUseStudioComp = false;
      }

      renderCompositeFrame();
      blitToRecordingCanvas();

      const bps = currentResTier === '4k' ? 54_000_000 : 24_000_000;
      const srcCanvas = (recGl && recBlitter) ? recCanvas : canvas;
      const stream = srcCanvas.captureStream(currentFps);
      const opts = mime ? {mimeType: mime, videoBitsPerSecond: bps} : {videoBitsPerSecond: bps};

      recChunks = [];
      mediaRecorder = new MediaRecorder(stream, opts);
      recStartTime = performance.now();
      recAutoStopSec = Number(document.getElementById('selRecDur').value) || 0;

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        let blob = new Blob(recChunks, {type: mediaRecorder.mimeType || (ext === 'mp4' ? 'video/mp4' : 'video/webm')});
        if (ext === 'mp4' && rangeMode !== 'passthrough') {
          blob = await normalizeMp4ColrToTvBt709(blob);
        }
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        const modeTag = currentLayout === 'vertical9x16' ? 'vertical_short' : currentLayout;
        const fname = `vrm_showcase_${modeTag}_${canvas.width}x${canvas.height}_${currentFps}fps.${ext}`;

        const dl = document.getElementById('recDlLink');
        dl.href = lastBlobUrl;
        dl.download = fname;
        dl.click();

        const mb = (blob.size / (1024 * 1024)).toFixed(1);
        document.getElementById('recToastText').textContent = `✅ 録画完了: ${fname} (${mb} MB · 白飛び補正済)`;
        document.getElementById('recToast').classList.add('show');

        document.body.classList.remove('is-recording');
        const btn = document.getElementById('btnRecord');
        btn.classList.remove('recording');
        btn.innerHTML = '<span class="desktop-only">🔴 録画スタート</span><span class="mobile-only">🔴 録画</span>';
        updateDisabledControlStates();
      };

      mediaRecorder.start(250);
      updateDisabledControlStates();
      const btn = document.getElementById('btnRecord');
      btn.classList.add('recording');
      btn.textContent = '⏹ 録画停止 (0.0s)';
      document.getElementById('recToast').classList.remove('show');
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    }

    document.getElementById('btnRecord').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
      else startRecording();
    });
    document.getElementById('btnCloseToast').addEventListener('click', () => {
      document.getElementById('recToast').classList.remove('show');
    });

    const OP_ACCENT_HEX = {
      cosmic_crystal: 0x6ce4ff,
      cosmic_blossom: 0xff82d4,
      cosmic_aurora: 0x5effd8,
      snow: 0xa4c4ff,
      studio: 0x8ea8f8,
      chroma: 0xffffff,
    };

    function renderCompositeFrame() {
      const W = canvas.width;
      const H = canvas.height;
      const th = THEMES[currentThemeKey] || THEMES.cosmic_crystal;
      const bdrHex = BORDER_COLORS[currentBorderKey];
      const isCols4Op = (currentLayout === 'cols4' && cols4OpMode !== 'off');

      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, W, H);
      if (isCols4Op) {
        const opBackdrop = th.chroma ? th.clear : ((currentThemeKey === 'studio' || currentThemeKey === 'snow') ? 0x121626 : 0x050813);
        renderer.setClearColor(opBackdrop, 1.0);
      } else {
        renderer.setClearColor(bdrHex !== null ? bdrHex : th.clear, 1.0);
      }
      renderer.clear(true, true, true);

      const panels = getActivePanels(W, H);
      renderer.setScissorTest(true);

      if (isCols4Op && !th.chroma) {
        // Subtle anime frame track guide lines between columns even before cut-in
        const gTrack = Math.max(2, Math.round(Math.min(W, H) * 0.0022));
        for (let i = 0; i < panels.length - 1; i++) {
          const gx = panels[i].vx + panels[i].vw;
          renderer.setScissor(gx, 0, gTrack, H);
          renderer.setClearColor(0x1b2440, 1.0);
          renderer.clear(true, false, false);
        }
      }

      const accentHex = OP_ACCENT_HEX[currentThemeKey] || 0x6ce4ff;

      for (const p of panels) {
        const sl = slots[p.slot];
        sl.camera.aspect = Math.max(0.05, p.vw / Math.max(1, p.vh));
        sl.camera.updateProjectionMatrix();
        sl.crystalField.userData.uniforms.uScaleY.value = p.vh;

        let sy = p.vy;
        let sh = p.vh;
        let vpY = p.vy;
        let opState = null;

        if (isCols4Op) {
          opState = evalCols4AnimeOp(p.slot, cols4OpClock);
          if (!opState.visible || opState.reveal <= 0.002) continue;
          sh = Math.max(1, Math.min(p.vh, Math.round(p.vh * opState.reveal)));
          sy = opState.dir >= 0 ? p.vy : (p.vy + p.vh - sh);
          // Snappy vertical anime kinetic slide-settle without aspect distortion
          const slidePx = Math.round((1.0 - opState.reveal) * p.vh * 0.072) * (opState.dir >= 0 ? -1 : 1);
          vpY = p.vy + slidePx;
        }

        renderer.setViewport(p.vx, vpY, p.vw, p.vh);
        renderer.setScissor(p.vx, sy, p.vw, sh);
        renderer.setClearColor(th.clear, 1.0);
        renderer.clear(true, true, false);
        // 1) Render Real-Time highp WebGL Cosmic Sky + Optical Bokeh/Starbursts + 3D Crystal Chords + Water Floor
        renderer.render(sl.bgScene, sl.camera);
        // 2) Clear depth so avatar renders crisply in front with ZERO additive bokeh bleed on face/hair!
        renderer.clearDepth();
        renderer.render(sl.scene, sl.camera);

        if (isCols4Op) {
          // Wipe-synced border line alongside active column
          if (bdrHex !== null && p.slot < 3) {
            const gBdr = panels[p.slot + 1].vx - (p.vx + p.vw);
            if (gBdr > 0) {
              renderer.setScissor(p.vx + p.vw, sy, gBdr, sh);
              renderer.setClearColor(bdrHex, 1.0);
              renderer.clear(true, false, false);
            }
          }
          // Glowing Anime OP shutter leading-edge laser bar
          if (opState.edgeBar && opState.reveal < 0.994 && !th.chroma) {
            const barH = Math.max(4, Math.round(H * 0.0055));
            const rawEdgeY = opState.dir >= 0 ? (sy + sh - barH) : sy;
            const edgeY = Math.max(0, Math.min(H - barH, rawEdgeY));
            renderer.setScissor(p.vx, edgeY, p.vw, barH);
            renderer.setClearColor(accentHex, 1.0);
            renderer.clear(true, false, false);

            const coreH = Math.max(2, Math.round(barH * 0.42));
            const coreY = edgeY + Math.floor((barH - coreH) * 0.5);
            renderer.setScissor(p.vx, coreY, p.vw, coreH);
            renderer.setClearColor(0xfff6e6, 1.0);
            renderer.clear(true, false, false);
          }
        }
      }
      renderer.setScissorTest(false);

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        blitToRecordingCanvas();
      }
    }

    let lastNow = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, Math.max(0.0001, (now - lastNow) / 1000));
      lastNow = now;

      const isCols4Op = (currentLayout === 'cols4' && cols4OpMode !== 'off');
      if (isCols4Op) {
        cols4OpClock += dt;
      }

      const panels = getActivePanels(canvas.width, canvas.height);
      for (const p of panels) {
        const sl = slots[p.slot];

        if (isCols4Op) {
          const op = evalCols4AnimeOp(p.slot, cols4OpClock);
          const hd = hitDivs[p.slot];
          if (hd) {
            hd.style.opacity = op.visible ? String(Math.min(1.0, op.reveal * 1.45)) : '0.12';
          }
          if (!op.visible) {
            sl.opPhaseKey = 'wait';
            sl.time = 0;
            if ((sl.motionId === 'custom_vrma') && sl.avatar.action) {
              sl.avatar.action.paused = true;
            }
            continue;
          }
          if (sl.opPhaseKey !== op.phaseKey) {
            // Column just cut open! Start its motion & camera rig cleanly at t = 0 for authentic staggered wave!
            sl.opPhaseKey = op.phaseKey;
            sl.time = 0;
            sl.camRig.ready = false;
            sl.emoState.ready = false;
            if ((sl.motionId === 'custom_vrma') && sl.avatar.action) {
              sl.avatar.action.paused = false;
              sl.avatar.action.reset().play();
              sl.avatar.playing = true;
            }
          } else if ((sl.motionId === 'custom_vrma') && sl.avatar.action?.paused) {
            sl.avatar.action.paused = false;
          }
        }

        sl.time += dt * sl.speed;
        sl.sky.material.uniforms.uTime.value = sl.time;
        sl.bokehStars.material.uniforms.uTime.value = sl.time;
        sl.crystalField.userData.uniforms.uTime.value = sl.time;
        sl.waterFloor.material.uniforms.uTime.value = sl.time;

        if (sl.avatar.vrm) {
          const vrm = sl.avatar.vrm;
          if (sl.motionId !== 'custom_vrma') {
            applyBuiltInPose(sl, sl.time);
          } else if (sl.avatar.playing && sl.avatar.mixer) {
            sl.avatar.mixer.update(dt);
          }
          // Always transfer normalized bones on EVERY display frame so 60Hz/120Hz/144Hz monitors never skip a pose frame!
          vrm.humanoid?.update();
          vrm.nodeConstraintManager?.update();
          if (sl.avatar.springManager) {
            sl.springRem = (sl.springRem || 0) + Math.min(dt, 0.05);
            const step = 1 / 60;
            while (sl.springRem >= step) {
              sl.avatar.springManager.update(step);
              sl.springRem -= step;
            }
          }
          updateSlotCameraMotion(sl, dt);
          if (shaderMode === 'mtoon') updateSlotMtoonLightDirection(sl);
          if (vrm.lookAt) {
            vrm.lookAt.target = sl.lookAtCam ? sl.camera : null;
            vrm.lookAt.autoUpdate = sl.lookAtCam;
            if (sl.lookAtCam) vrm.lookAt.update(dt);
          }
          updateSlotExpressions(sl, dt);
          vrm.expressionManager?.update();
          if (vrm.materials) {
            for (const m of vrm.materials) m.update?.(dt);
          }
        }
      }

      renderCompositeFrame();

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        const elapsed = (now - recStartTime) / 1000;
        const btn = document.getElementById('btnRecord');
        const mob = isMobileViewport();
        if (recAutoStopSec > 0) {
          btn.textContent = mob ? `⏹ ${elapsed.toFixed(1)}s` : `⏹ 停止 (${elapsed.toFixed(1)}s / ${recAutoStopSec}s)`;
          if (elapsed >= recAutoStopSec) stopRecording();
        } else {
          btn.textContent = mob ? `⏹ ${elapsed.toFixed(1)}s` : `⏹ 録画停止 (${elapsed.toFixed(1)}s)`;
        }
      }
    }

    fitStagePreview();
    void calibrateMp4EncoderRange();
    void loadStudioModel(async () => {
      const response = await fetch(DEFAULT_VRM_URL);
      if (!response.ok) throw new Error('雪貂VRMを取得できませんでした。手元のVRMを開けます。');
      return response.arrayBuffer();
    }, MODEL_NAME);
    requestAnimationFrame(animate);
  </script>
</body>
