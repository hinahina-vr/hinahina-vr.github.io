<!doctype html><meta charset="utf-8"><title>Heart contour regression</title>
<h1>Heart contour regression</h1><pre id="result">Running</pre><canvas id="canvas"></canvas>
<script type="module">
import { SoulRenderer } from '../../src/chat/soul.mjs?v=20261030-heart1';
const canvas = document.querySelector('canvas');
const renderer = new SoulRenderer(canvas, available => { if (!available) throw Error('WebGL unavailable'); });
// Isolate the decorative background from unrelated particle alpha.
renderer.pointCount = 0;
const results = [];
for (const [width, height] of [[1440,900],[390,844],[844,390]]) {
  canvas.style.width = width + 'px'; canvas.style.height = height + 'px'; renderer.resize();
  const scale = Math.min(1,width/height*1.35), gl = renderer.gl;
  for (const time of [0,2,7,19,90]) {
    renderer.time = time; renderer.draw();
    const pixels = new Uint8Array(canvas.width*canvas.height*4);
    gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    const floating = [Math.sin(time*.45)*.015,Math.cos(time*.6)*.018];
    for (const [cx,cy] of [[.55+floating[0],.27+floating[1]],[-.52-floating[0],-.2-floating[1]]]) {
      const alphaAt = (x,y) => {
        const px = Math.round(((cx+x/16)*scale*height/width+1)*canvas.width/2-.5);
        const py = Math.round(((cy+y/16)*scale+.14+1)*canvas.height/2-.5);
        return pixels[(py*canvas.width+px)*4+3];
      };
      const samples = {cleft:alphaAt(0,.95),belowTip:alphaAt(0,-1.05),left:alphaAt(-1.1,.3),right:alphaAt(1.1,.3),center:alphaAt(0,0),lobe:alphaAt(.35,.35)};
      const passed = samples.cleft<8 && samples.belowTip<8 && samples.left<8 && samples.right<8 && samples.center>210 && samples.lobe>210;
      results.push({width,height,time,samples,passed});
    }
  }
}
const report = {version:'20261030-heart1',passed:results.every(x=>x.passed),checks:results.length,results};
document.querySelector('#result').textContent=JSON.stringify(report,null,2);
document.body.dataset.result=report.passed?'passed':'failed';
</script>
